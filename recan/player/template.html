<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recording Playback — {{ document_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>{{ css }}</style>
</head>
<body>
  <div class="app">
    <main class="player-main">
      <header class="topbar">
        <span class="filename" id="filename"></span>
        <span class="lang-pill" id="lang-pill"></span>
      </header>
      <section class="editor-wrap">
        <pre class="editor"><code id="editor-code" class="language-plaintext"></code></pre>
        <div class="unfocused-overlay" id="unfocused-overlay" hidden>
          <div class="unfocused-badge">
            <span class="dot"></span>
            <span>Window unfocused · <span id="unfocused-elapsed">0:00</span></span>
          </div>
        </div>
      </section>
      <section class="timeline">
        <div class="timeline-track" id="timeline-track">
          <div class="markers" id="timeline-markers"></div>
          <div class="playhead" id="playhead"></div>
        </div>
        <div class="transport">
          <div class="transport-left">
            <button class="play-btn" id="play-btn" aria-label="Play">▶</button>
            <select class="speed" id="speed">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="5">5×</option>
            </select>
          </div>
          <div class="time">
            <span class="now" id="now-time">—</span>
            <span class="total" id="total-time"> / —</span>
          </div>
        </div>
      </section>
    </main>
    <aside class="stats" id="stats"></aside>
  </div>

  <script>{{ highlight }}</script>
  <script>window.__BUNDLE__ = {{ bundle }};</script>
  <script>{{ js }}</script>
</body>
</html>
