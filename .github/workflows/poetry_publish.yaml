name: BYU-Recan Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  publish:
    uses: BYU-CS-Course-Ops/utils/.github/workflows/publish.yaml@main
    with:
      pypi_package: "byu-recan"
      publisher: "poetry"
      project_name: "BYU-Recan"
      version_source: "file"
      version_path: "recan/VERSION"
      changelog_path: "CHANGELOG.md"
    secrets:
      pypi_token: ${{ secrets.PYPI_TOKEN }}
      discord_webhook_url: ${{ secrets.GHA_DISCORD_WEBHOOK }}
      discord_role: ${{ secrets.CICD_NOTIFY_DISCORD_ROLE }}

